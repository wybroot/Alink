services:
  postgresql:
    image: postgres:17
    container_name: alink-postgresql
    environment:
      POSTGRES_DB: alink
      POSTGRES_USER: alink
      POSTGRES_PASSWORD: alink
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U alink" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - alink-network
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.131.0
    container_name: victoriametrics
    command:
      - "-retentionPeriod=7d"  # 保留 7 天数据
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    ports:
      - "127.0.0.1:8428:8428"  # API, PromQL, insert, select
    volumes:
      - ./data/vmdata:/victoria-metrics-data
    restart: always
    networks:
      - alink-network
  alink:
    image: wangyanbiao/alink:latest
    container_name: alink-server
    volumes:
      - ./config.yaml:/app/config.yaml
    # 开启 Geo 配置后打开下面的配置
    #  - ./GeoLite2-City.mmdb:/app/GeoLite2-City.mmdb
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      victoriametrics:
        condition: service_started
    restart: always
    dns:
      - 127.0.0.11
      - 8.8.8.8
    networks:
      - alink-network

networks:
  alink-network:
    driver: bridge

